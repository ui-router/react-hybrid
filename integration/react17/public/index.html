<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#000000" />
    <link rel="shortcut icon" href="favicon.ico" />
    <style>
      a {
        display: block;
      }
    </style>
    <title>ui-router-react-hybrid</title>
  </head>
  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root">
      <a id="react" ui-sref="react" ui-sref-active-eq="active">react</a>
      <a id="react_angular" ui-sref="react.angular" ui-sref-active-eq="active">react.angular</a>
      <a id="react_angular_react" ui-sref="react.angular.react" ui-sref-active-eq="active">react.angular.react</a>
      <a id="react_angular_react_angular" ui-sref="react.angular.react.angular" ui-sref-active-eq="active"
        >react.angular.react.angular</a
      >
      <a id="angular" ui-sref="angular" ui-sref-active-eq="active">angular</a>
      <a id="angular_react" ui-sref="angular.react" ui-sref-active-eq="active">angular.react</a>
      <a id="angular_react_angular" ui-sref="angular.react.angular" ui-sref-active-eq="active">angular.react.angular</a>
      <a id="angular_react_angular_react" ui-sref="angular.react.angular.react" ui-sref-active-eq="active"
        >angular.react.angular.react</a
      >
      <a
        id="angularComponentProvider"
        ui-sref="angularComponentProvider({ component: 'angularComponent' })"
        ui-sref-active-eq="active"
        >angularComponentProvider</a
      >
      <a
        id="angularComponentProvider2"
        ui-sref="angularComponentProvider({ component: 'angularComponent2' })"
        ui-sref-active-eq="active"
        >angularComponentProvider2</a
      >
      <a
        id="reactComponentProvider"
        ui-sref="reactComponentProvider({ component: 'ReactComponent' })"
        ui-sref-active-eq="active"
        >reactComponentProviderClass</a
      >
      <a
        id="reactComponentProvider2"
        ui-sref="reactComponentProvider({ component: 'ReactFunctionalComponent' })"
        ui-sref-active-eq="active"
        >reactComponentProviderFunctional</a
      >
      <ui-view></ui-view>
    </div>
  </body>
</html>
